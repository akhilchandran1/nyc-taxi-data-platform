version: 2

models:
  - name: dim_date
    columns:
      - name: trip_date
        tests:
          - unique
          - not_null
  - name: fct_yellow_trips
    columns:
      - name: raw_trip_id
        tests:
          - unique
          - not_null
      - name: trip_date
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: trip_date
      - name: total_amount
        tests:
          - not_null
  - name: daily_trip_metrics
    columns:
      - name: trip_date
        tests:
          - unique
          - not_null
  - name: hourly_pickup_metrics
    columns:
      - name: trip_date
        tests:
          - not_null
      - name: pickup_hour
        tests:
          - not_null
