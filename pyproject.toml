[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-data-platform"
version = "0.1.0"
description = "ETL and analytics for NYC TLC yellow taxi trip data."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Akhil"}]
dependencies = [
    "pandas>=2.2,<3.1",
    "pyarrow>=17,<27",
    "SQLAlchemy>=2.0.30,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
dbt = ["dbt-core>=1.9,<1.13", "dbt-postgres>=1.9,<1.13"]
dashboard = ["streamlit>=1.40,<2", "plotly>=6,<7"]

[project.scripts]
taxi-pipeline = "taxi_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
